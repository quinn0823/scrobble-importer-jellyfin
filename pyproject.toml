[project]
name = "scrobble-importer-jellyfin"
version = "0.1.0"
description = "One-time import of Jellyfin Playback Reporting history into ListenBrainz."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
scrobble-importer-jellyfin = "scrobble_importer_jellyfin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["scrobble_importer_jellyfin.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
